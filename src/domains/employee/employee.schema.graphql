scalar Date

extend type Query {
  employees(pagination: PaginationInput): EmployeesPage!
  employee(id: ID!): Employee!
}

type Mutation {
  createEmployee(newEmployee: CreateEmployeeInput): Employee!
  updateEmployee(id: ID!, updatedEmployee: CreateEmployeeInput): Employee!
}

type Employee {
  id: ID!
  firstName: String!
  lastName: String!
  role: String!
  email: String!
  phoneNumber: String!
  timeEntries: [TimeEntry]!
}

input PaginationInput {
  page: Int!
  perPage: Int!
}

type PaginationResponse {
  page: Int!
  perPage: Int!
  totalCount: Int!
}

type EmployeesPage {
  pagination: PaginationResponse!
  employees: [Employee]!
}

input CreateEmployeeInput {
  firstName: String!
  lastName: String!
  role: String!
  email: String!
  phoneNumber: String!
}
