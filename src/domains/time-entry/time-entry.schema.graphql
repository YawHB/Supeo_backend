type TimeEntry {
  id: ID!
  startTime: String!
  endTime: String!
  duration: String!
  comment: String
  date: Date!
}

#Entry points
extend type Query {
  timeEntries: [TimeEntry]!
  timeEntry(id: ID!): TimeEntry!
}

input CreateTimeEntryInput {
  startTime: String!
  endTime: String!
  duration: String!
  comment: String
  date: Date!
  employeeID: ID!
}

type Mutation {
  createTimeEntry(newTimeEntry: CreateTimeEntryInput): TimeEntry!
}
