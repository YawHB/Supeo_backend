services:
  backend:
    build: './'
    container_name: supeo_backend_container
    ports:
      - '4000:4000'
    env_file:
      - .env
    depends_on:
      - postgres

    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16
    container_name: postgres_supeo_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

    ports:
      - '5432:5432'
    volumes:
      - supeo_data:/var/lib/postgresql/data # Gem data mellem genstarter
      - ./db-scripts:/docker-entrypoint-initdb.d # Kør SQL første gang

volumes:
  supeo_data:
